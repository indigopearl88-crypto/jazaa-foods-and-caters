    </text>
    <!-- FOODS & CATERS in Gold Accent -->
    <text x="80" y="24" font-family="'Manrope', 'Cinzel', system-ui, sans-serif" font-size="19" font-weight="600" letter-spacing="0.12em" fill="url(#goldGrad)">
      FOODS &amp; CATERS
    </text>
    
    <!-- Subtitle / Location -->
    <text x="1" y="38" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="0.26em" fill="#7A7872">
      IQBAL TOWN MARQUEE COMPLEX · MAIN EXPRESSWAY
